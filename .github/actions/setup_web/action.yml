name: 'Setup Web Toolchain'
description: 'Installs web dependencies.'
# Node (web/.nvmrc) and pnpm (web/package.json packageManager, via corepack) come with the CI container image;
# the pnpm store is the runner's persistent cache (/cache/pnpm-store).
runs:
  using: "composite"
  steps:
    - name: Install web dependencies
      shell: bash ./ci/run-ci bash -euo pipefail {0}
      run: cd web && pnpm install --frozen-lockfile
