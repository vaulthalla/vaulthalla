name: Vaulthalla CI Build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner
        with:
          test: 'true'
          build_web: 'true'
          test_web: 'true'

  tooling:
    name: Release contract, packaging contracts, lifecycle and lab tests, shellcheck
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install vl-release
        uses: ./.github/actions/setup_valkyrianlabs_tools

      - name: Release contract, packaging contracts, lifecycle and lab tests
        run: bash tools/dev/verify.sh release packaging lifecycle

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=900 install -y shellcheck || { sudo apt-get -o DPkg::Lock::Timeout=900 update && sudo apt-get -o DPkg::Lock::Timeout=900 install -y shellcheck; }
          fi

      - name: shellcheck (maintainer scripts blocking, bin/ advisory)
        run: bash .github/scripts/shellcheck.sh
