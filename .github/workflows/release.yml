name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or SHA to release-check.
        required: false
        type: string
      publish:
        description: Run protected publication steps.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      release_notes_base:
        description: Optional explicit successful release tag for changelog/release-notes generation.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_AI_MODE: ${{ vars.RELEASE_AI_MODE || 'auto' }}
  RELEASE_AI_PROFILE_OPENAI: ${{ vars.RELEASE_AI_PROFILE_OPENAI || 'openai-balanced' }}
  RELEASE_LOCAL_LLM_ENABLED: ${{ vars.RELEASE_LOCAL_LLM_ENABLED || 'false' }}
  RELEASE_LOCAL_LLM_PROFILE: ${{ vars.RELEASE_LOCAL_LLM_PROFILE || '' }}
  RELEASE_LOCAL_LLM_BASE_URL: ${{ vars.RELEASE_LOCAL_LLM_BASE_URL || '' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
  RELEASE_LOCAL_LLM_API_KEY: ${{ secrets.RELEASE_LOCAL_LLM_API_KEY || '' }}
  RELEASE_DEBIAN_DISTRIBUTION: ${{ vars.RELEASE_DEBIAN_DISTRIBUTION || '' }}
  RELEASE_DEBIAN_URGENCY: ${{ vars.RELEASE_DEBIAN_URGENCY || '' }}
  RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'disabled' }}
  RELEASE_PUBLISH_REQUIRED: ${{ vars.RELEASE_PUBLISH_REQUIRED || 'auto' }}
  RELEASE_APT_REPOSITORY_URL: ${{ vars.RELEASE_APT_REPOSITORY_URL || '' }}
  RELEASE_APT_SUITE: ${{ vars.RELEASE_APT_SUITE || 'stable' }}
  RELEASE_APT_COMPONENTS: ${{ vars.RELEASE_APT_COMPONENTS || 'main' }}
  RELEASE_APT_ARCHITECTURES: ${{ vars.RELEASE_APT_ARCHITECTURES || 'amd64' }}
  RELEASE_EXPECTED_DEBIAN_PACKAGES: ${{ vars.RELEASE_EXPECTED_DEBIAN_PACKAGES || '' }}
  DOCS_SYNC_ENDPOINT: ${{ vars.DOCS_SYNC_ENDPOINT || 'https://vaulthalla.io/api/documentation/sync' }}
  NEXUS_REPO_URL: ${{ vars.NEXUS_REPO_URL || '' }}
  NEXUS_USER: ${{ secrets.NEXUS_USER || '' }}
  NEXUS_PASS: ${{ secrets.NEXUS_PASS || '' }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  validate-release-state:
    name: Validate release state
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    outputs:
      version: ${{ steps.state.outputs.version }}
      release_tag: ${{ steps.state.outputs.release_tag }}
      publish_required: ${{ steps.state.outputs.publish_required }}
      release_notes_base: ${{ steps.release_base.outputs.release_notes_base }}
      release_notes_base_source: ${{ steps.release_base.outputs.release_notes_base_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate versions and publication policy
        id: state
        shell: bash
        env:
          DISPATCH_REF: ${{ github.event.inputs.ref || '' }}
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'dry-run' }}
        run: |
          set -euo pipefail
          python -m tools.release check

          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be a plain semantic version, got '${version}'."
            exit 1
          fi

          release_tag=""
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "$DISPATCH_REF" == refs/tags/* ]]; then
            release_tag="${DISPATCH_REF#refs/tags/}"
          elif [[ "$DISPATCH_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$DISPATCH_REF"
          fi

          raw_required="${RELEASE_PUBLISH_REQUIRED:-auto}"
          case "$raw_required" in
            auto)
              if [[ "${GITHUB_REF:-}" == refs/tags/* ]] || [ "$DISPATCH_PUBLISH" = "publish" ]; then
                publish_required="true"
              else
                publish_required="false"
              fi
              ;;
            true|false)
              publish_required="$raw_required"
              ;;
            *)
              echo "::error::Invalid RELEASE_PUBLISH_REQUIRED value: ${raw_required}. Expected auto|true|false."
              exit 1
              ;;
          esac

          if [ "$DISPATCH_PUBLISH" = "publish" ]; then
            publish_required="true"
          fi

          if [ -n "$release_tag" ]; then
            if [ "$release_tag" != "v${version}" ] && [ "$release_tag" != "$version" ]; then
              echo "::error::Release tag '${release_tag}' does not match VERSION '${version}'."
              echo "::error::Expected 'v${version}' or '${version}'."
              exit 1
            fi
          fi

          if [ "$publish_required" = "true" ]; then
            if [ -z "$release_tag" ]; then
              echo "::error::Publication requires a release tag."
              exit 1
            fi
            if [ "$release_tag" != "v${version}" ]; then
              echo "::error::Publication requires the canonical tag 'v${version}'."
              exit 1
            fi
          fi

          {
            echo "version=${version}"
            echo "release_tag=${release_tag}"
            echo "publish_required=${publish_required}"
          } >> "$GITHUB_OUTPUT"

          echo "VERSION=${version}"
          echo "release_tag=${release_tag:-<none>}"
          echo "publish_required=${publish_required}"

      - name: Resolve successful release notes base
        id: release_base
        shell: bash
        env:
          INPUT_RELEASE_NOTES_BASE: ${{ github.event.inputs.release_notes_base || '' }}
        run: |
          set -euo pipefail
          mkdir -p .release-base
          resolve_args=(--output .release-base/release_notes_base.resolution.json)
          if [ -n "$INPUT_RELEASE_NOTES_BASE" ]; then
            resolve_args+=(--release-notes-base "$INPUT_RELEASE_NOTES_BASE")
          fi
          python -m tools.release resolve-release-notes-base "${resolve_args[@]}"
          release_notes_base="$(python -c 'import json; from pathlib import Path; print(json.loads(Path(".release-base/release_notes_base.resolution.json").read_text(encoding="utf-8"))["last_successful_release_tag"])')"
          release_notes_base_source="$(python -c 'import json; from pathlib import Path; print(json.loads(Path(".release-base/release_notes_base.resolution.json").read_text(encoding="utf-8"))["source"])')"
          {
            echo "release_notes_base=${release_notes_base}"
            echo "release_notes_base_source=${release_notes_base_source}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release base resolution
        uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-release-base-${{ steps.state.outputs.version }}
          path: .release-base/release_notes_base.resolution.json
          if-no-files-found: error

  core-verify:
    name: Core build and tests
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs: validate-release-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build core
        uses: ./.github/actions/build

      - name: Run core tests
        uses: ./.github/actions/test

  release-tooling-verify:
    name: Release tooling tests
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs: validate-release-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run release tooling tests
        run: python -m unittest discover -s tools/release/tests -p 'test_*.py'

  web-verify:
    name: Web build and checks
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs: validate-release-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup web toolchain
        uses: ./.github/actions/setup_web

      - name: Build web
        uses: ./.github/actions/build_web

      - name: Run web checks
        uses: ./.github/actions/test_web

  docs-validate:
    name: Documentation validation
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs: validate-release-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install pmdocs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::Expected apt-based runner for pmdocs provisioning."
            exit 1
          fi
          APT_PREFIX=""
          if command -v sudo >/dev/null 2>&1; then
            APT_PREFIX="sudo"
          fi
          ${APT_PREFIX} apt-get update
          ${APT_PREFIX} apt-get install -y ca-certificates curl
          ${APT_PREFIX} install -d -m 0755 /etc/apt/keyrings
          ${APT_PREFIX} curl -fsSL https://apt.valkyrianlabs.com/pubkey.gpg \
            -o /etc/apt/keyrings/valkyrianlabs.gpg
          ${APT_PREFIX} chmod 0644 /etc/apt/keyrings/valkyrianlabs.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/valkyrianlabs.gpg] https://apt.valkyrianlabs.com stable main" \
            | ${APT_PREFIX} tee /etc/apt/sources.list.d/valkyrianlabs.list > /dev/null
          ${APT_PREFIX} apt-get update
          ${APT_PREFIX} apt-get install -y pmdocs
          pmdocs --version

      - name: Validate documentation package
        run: pmdocs validate --source docs

  release-artifacts:
    name: Build release artifacts
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs:
      - validate-release-state
      - core-verify
      - release-tooling-verify
      - web-verify
      - docs-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "RELEASE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Setup web toolchain
        uses: ./.github/actions/setup_web

      - name: Sync private web icons for release packaging
        uses: ./.github/actions/sync_web_icons

      - name: Download release base resolution
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-base-${{ needs.validate-release-state.outputs.version }}
          path: .release-base

      - name: Build release artifacts (Debian + web deployable)
        id: package
        uses: ./.github/actions/package
        with:
          output_dir: release
          python_executable: ${{ env.RELEASE_PYTHON }}
          release_notes_base_resolution: .release-base/release_notes_base.resolution.json

      - name: Verify release artifact directory before upload
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${{ steps.package.outputs.artifact_dir }}"
          if [ -z "$artifact_dir" ]; then
            echo "::error::Package action did not return artifact_dir output."
            exit 1
          fi
          if [ ! -d "$artifact_dir" ]; then
            echo "::error::artifact_dir does not exist: $artifact_dir"
            exit 1
          fi
          echo "Artifact directory: $artifact_dir"
          echo "Staged files:"
          find "$artifact_dir" -maxdepth 2 -type f | sort

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.validate-release-state.outputs.version }}
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error

  publish-debian:
    name: Publish Debian packages
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs:
      - validate-release-state
      - release-artifacts
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download combined release artifact
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.validate-release-state.outputs.version }}
          path: release

      - name: Publish or dry-run Debian packages
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.validate-release-state.outputs.publish_required }}" = "true" ]; then
            python -m tools.release publish-deb --output-dir release --require-enabled
          else
            python -m tools.release publish-deb --output-dir release --mode disabled --dry-run
          fi

      - name: Verify published APT package metadata
        if: needs.validate-release-state.outputs.publish_required == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-release-state.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-release-state.outputs.release_tag }}
        run: |
          set -euo pipefail
          next_patch="$(python -c 'import os; major, minor, patch = (int(part) for part in os.environ["RELEASE_VERSION"].split(".")); print(f"{major}.{minor}.{patch + 1}")')"
          for attempt in 1 2 3 4 5; do
            if python -m tools.release resolve-release-notes-base \
              --version "$next_patch" \
              --output release/current_publication.resolution.json; then
              resolved="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("release/current_publication.resolution.json").read_text(encoding="utf-8"))["last_successful_release_tag"])')"
              if [ "$resolved" = "$RELEASE_TAG" ]; then
                echo "[publish] verified APT metadata for ${RELEASE_TAG}"
                exit 0
              fi
              echo "[publish] APT metadata resolved ${resolved}, expected ${RELEASE_TAG}"
            fi
            echo "[publish] APT metadata verification attempt ${attempt}/5 did not confirm ${RELEASE_TAG}; waiting."
            sleep 15
          done
          echo "::error::Published APT metadata did not confirm ${RELEASE_TAG}."
          exit 1

  github-release:
    name: Update GitHub Release
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs:
      - validate-release-state
      - release-artifacts
      - publish-debian
    if: >
      needs.validate-release-state.outputs.publish_required == 'true' &&
      needs.validate-release-state.outputs.release_tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download combined release artifact
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.validate-release-state.outputs.version }}
          path: release

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare GitHub release asset list (deduped)
        id: gh_release_assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_assets < <(find release -type f | LC_ALL=C sort -u)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "::error::No files found for GitHub release asset attachment under release."
            exit 1
          fi
          echo "[gh-release] deduped asset count: ${#release_assets[@]}"
          printf '%s\n' "${release_assets[@]}"
          {
            echo "assets<<EOF"
            printf '%s\n' "${release_assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub Release notes sync mode
        id: release_notes_sync
        shell: bash
        run: |
          set -euo pipefail
          selection_path="release/changelog.selection.json"
          release_notes_path="release/release_notes.md"
          if [ ! -f "${selection_path}" ]; then
            echo "::error::Missing changelog selection metadata: ${selection_path}"
            exit 1
          fi
          export SELECTION_PATH="${selection_path}"
          export RELEASE_NOTES_PATH="${release_notes_path}"
          python -c '
          import json
          import os
          import sys
          from pathlib import Path

          selection_path = Path(os.environ["SELECTION_PATH"])
          notes_path = Path(os.environ["RELEASE_NOTES_PATH"])
          out_path = Path(os.environ["GITHUB_OUTPUT"])
          data = json.loads(selection_path.read_text(encoding="utf-8"))

          selected_path = str(data.get("selected_path") or "").strip() or "unknown"
          ai_mode = str(data.get("ai_mode") or "").strip() or "unknown"
          openai_profile = str(data.get("openai_profile") or "").strip() or "<unset>"
          local_profile = str(data.get("local_profile") or "").strip() or "<unset>"
          notes_generated = bool(data.get("release_notes_generated"))
          notes_exists = notes_path.is_file()
          notes_nonempty = notes_exists and bool(notes_path.read_text(encoding="utf-8").strip())

          should_sync = notes_generated and notes_nonempty
          reason = "release_notes_present"
          if not notes_generated:
              reason = f"release_notes_not_generated_for_selected_path:{selected_path}"
          elif not notes_nonempty:
              reason = "release_notes_missing_or_empty"

          if notes_generated and not notes_nonempty:
              print(f"::error::Selection metadata reports generated release notes, but file is missing/empty: {notes_path}")
              sys.exit(1)

          def bool_output(value):
              return "true" if value else "false"

          with out_path.open("a", encoding="utf-8") as fh:
              fh.write(f"selected_path={selected_path}\n")
              fh.write(f"ai_mode={ai_mode}\n")
              fh.write(f"openai_profile={openai_profile}\n")
              fh.write(f"local_profile={local_profile}\n")
              fh.write(f"release_notes_generated={bool_output(notes_generated)}\n")
              fh.write(f"release_notes_exists={bool_output(notes_exists)}\n")
              fh.write(f"release_notes_nonempty={bool_output(notes_nonempty)}\n")
              fh.write(f"should_sync={bool_output(should_sync)}\n")
              fh.write(f"reason={reason}\n")
          '

      - name: Log release path decision
        shell: bash
        run: |
          set -euo pipefail
          echo "[release-path] ai_mode=${{ steps.release_notes_sync.outputs.ai_mode }}"
          echo "[release-path] openai_profile=${{ steps.release_notes_sync.outputs.openai_profile }}"
          echo "[release-path] local_profile=${{ steps.release_notes_sync.outputs.local_profile }}"
          echo "[release-path] selected_path=${{ steps.release_notes_sync.outputs.selected_path }}"
          echo "[release-path] release_notes_generated=${{ steps.release_notes_sync.outputs.release_notes_generated }}"
          echo "[release-path] release_notes_exists=${{ steps.release_notes_sync.outputs.release_notes_exists }}"
          echo "[release-path] release_notes_nonempty=${{ steps.release_notes_sync.outputs.release_notes_nonempty }}"
          echo "[release-path] should_sync=${{ steps.release_notes_sync.outputs.should_sync }}"
          echo "[release-path] reason=${{ steps.release_notes_sync.outputs.reason }}"

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release-state.outputs.release_tag }}
          files: ${{ steps.gh_release_assets.outputs.assets }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Skip GitHub Release body sync
        if: steps.release_notes_sync.outputs.should_sync != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[gh-release-sync] skipped: ${{ steps.release_notes_sync.outputs.reason }}"

      - name: Sync GitHub Release body from generated release_notes.md
        if: steps.release_notes_sync.outputs.should_sync == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES_PATH: release/release_notes.md
        with:
          github-token: ${{ github.token }}
          script: |
            const child_process = require('node:child_process');
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');

            const notesPath = process.env.RELEASE_NOTES_PATH;
            if (!notesPath || !fs.existsSync(notesPath)) {
              core.setFailed(`Generated release notes artifact is missing: ${notesPath}`);
              return;
            }
            const generatedBody = fs.readFileSync(notesPath, 'utf8');
            if (!generatedBody.trim()) {
              core.setFailed(`Generated release notes artifact is empty: ${notesPath}`);
              return;
            }

            const tag = '${{ needs.validate-release-state.outputs.release_tag }}';
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              core.setFailed(`No matching GitHub Release exists for tag ${tag}: ${error.message}`);
              return;
            }

            const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'vaulthalla-release-notes-'));
            const existingBodyPath = path.join(tempDir, 'existing_release_body.md');
            const mergedBodyPath = path.join(tempDir, 'merged_release_body.md');
            fs.writeFileSync(existingBodyPath, release.data.body || '', 'utf8');

            child_process.execFileSync(
              'python',
              [
                '-c',
                [
                  'import os',
                  'from pathlib import Path',
                  'from tools.release.changelog.release_notes_merge import merge_release_notes_body',
                  'existing = Path(os.environ["EXISTING_RELEASE_BODY_PATH"]).read_text(encoding="utf-8")',
                  'generated = Path(os.environ["RELEASE_NOTES_PATH"]).read_text(encoding="utf-8")',
                  'merged = merge_release_notes_body(existing, generated, tag=os.environ.get("RELEASE_TAG") or None)',
                  'Path(os.environ["MERGED_RELEASE_BODY_PATH"]).write_text(merged, encoding="utf-8")',
                ].join('\n'),
              ],
              {
                cwd: process.env.GITHUB_WORKSPACE,
                env: {
                  ...process.env,
                  EXISTING_RELEASE_BODY_PATH: existingBodyPath,
                  MERGED_RELEASE_BODY_PATH: mergedBodyPath,
                  RELEASE_TAG: tag,
                },
                stdio: 'inherit',
              },
            );

            const body = fs.readFileSync(mergedBodyPath, 'utf8');
            if (!body.trim()) {
              core.setFailed(`Merged GitHub Release body is empty for tag ${tag}.`);
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              tag_name: tag,
              name: tag,
              body,
            });

            core.info(`Merged generated notes into GitHub Release ${release.data.id} for tag ${tag} from ${notesPath}.`);

  docs-publish:
    name: Publish docs
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs:
      - validate-release-state
      - docs-validate
      - publish-debian
      - github-release
    if: >
      needs.validate-release-state.outputs.publish_required == 'true' &&
      needs.docs-validate.result == 'success' &&
      needs.publish-debian.result == 'success' &&
      needs.github-release.result == 'success'
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install pmdocs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.valkyrianlabs.com/pubkey.gpg -o valkyrianlabs.gpg
          sudo install -m 0644 valkyrianlabs.gpg /etc/apt/keyrings/valkyrianlabs.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/valkyrianlabs.gpg] https://apt.valkyrianlabs.com stable main" \
            | sudo tee /etc/apt/sources.list.d/valkyrianlabs.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y pmdocs
          pmdocs --version

      - name: Validate and push docs
        shell: bash
        run: |
          set -euo pipefail
          pmdocs validate --source docs
          pmdocs push \
            --endpoint "${DOCS_SYNC_ENDPOINT}" \
            --source docs \
            --github-oidc \
            --publish

  record-release-success:
    name: Record release success
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu-latest-lts
    needs:
      - validate-release-state
      - publish-debian
      - github-release
      - docs-publish
    if: >
      needs.validate-release-state.outputs.publish_required == 'true' &&
      needs.publish-debian.result == 'success' &&
      needs.github-release.result == 'success' &&
      needs.docs-publish.result == 'success'
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download combined release artifact
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.validate-release-state.outputs.version }}
          path: release

      - name: Write release success ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.release record-release-success \
            --output-dir release \
            --tag "${{ needs.validate-release-state.outputs.release_tag }}" \
            --version "${{ needs.validate-release-state.outputs.version }}" \
            --publication-mode "${RELEASE_PUBLISH_MODE:-disabled}" \
            --target-url "${RELEASE_APT_REPOSITORY_URL:-${NEXUS_REPO_URL:-}}" \
            --workflow-run-id "${GITHUB_RUN_ID}"

      - name: Upload release success ledger artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-release-success-${{ needs.validate-release-state.outputs.version }}
          path: release/vaulthalla-release-success.json
          if-no-files-found: error

      - name: Attach release success ledger to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release-state.outputs.release_tag }}
          files: release/vaulthalla-release-success.json
          fail_on_unmatched_files: true
          overwrite_files: true
