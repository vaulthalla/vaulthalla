name: Release Pipeline

# Releases are cut with vl-release: `vlr cut patch|minor|major|X.Y.Z --push` bumps, commits and tags; the `v*` tag
# push starts this workflow. Release semantics live in `vlr` commands (release.toml, `vlr help ci`); this file only
# provides triggers, runners, credentials and job ordering. See .claude/context/release-pipeline.md.
#
# Transaction: check -> verify -> prepare + build + validate (artifact) -> publish APT -> GitHub release -> finalize.
# `vlr prepare` promotes .release/*_NEXT.md into debian/changelog + RELEASE_NOTES.md in each job's work tree only
# (deterministic); `vlr finalize` commits that history to main only after every publication succeeded. A failed run
# leaves the repository untouched and can be re-run ("Re-run failed jobs"); publication never replaces bytes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to release-check (default the selected ref).
        required: false
        type: string
      publish:
        description: Publish (requires a v* tag ref) or only build and validate.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
  push:
    tags:
      - "v*"

# Least privilege by default; jobs that write (GitHub release, finalize, docs OIDC) widen it locally.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Runners: the VPS runner (gh-vaulthalla, labels vaulthalla + vps-ci). Every run step executes in the disposable CI
# container (ci/run-ci, rootless Podman, ci/Containerfile), which carries vl-release, pmdocs, gh, shellcheck, Node/pnpm
# and the build dependencies: no host sudo, apt or Docker. The licensed icon store is mounted read-only.
env:
  RELEASE_REF: ${{ github.event.inputs.ref || github.ref }}
  DOCS_SYNC_ENDPOINT: ${{ vars.DOCS_SYNC_ENDPOINT || 'https://vaulthalla.io/api/documentation/sync' }}
  CI_CACHE_NAMES: ccache
  CI_RO_MOUNTS: /home/gh-vaulthalla/vaulthalla-web-icons:/opt/vaulthalla-web-icons
  VAULTHALLA_WEB_ICON_SRC: /opt/vaulthalla-web-icons

jobs:
  release-check:
    name: Release check
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 20
    outputs:
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
      publish_required: ${{ steps.state.outputs.publish_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check the release contract
        id: state
        env:
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'dry-run' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag=""
          case "$RELEASE_REF" in
            refs/tags/*) tag="${RELEASE_REF#refs/tags/}" ;;
            v[0-9]*) tag="$RELEASE_REF" ;;
          esac
          publish_required=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "$DISPATCH_PUBLISH" = "publish" ]; then
            publish_required=true
            if [ -z "$tag" ]; then
              echo "::error::Publication requires a v* tag ref, got '${RELEASE_REF}'."
              exit 1
            fi
          fi
          if [ -n "$tag" ]; then
            vlr check --release --tag "$tag"
          else
            vlr check --release
          fi
          vlr version check
          vlr status
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "publish_required=${publish_required}"
          } >> "$GITHUB_OUTPUT"

  contracts-verify:
    name: Packaging contracts, lifecycle and lab tests, shellcheck
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: release-check
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Release contract, packaging contracts, lifecycle and lab tests
        run: bash tools/dev/verify.sh release packaging lifecycle

      - name: shellcheck (maintainer scripts blocking, bin/ advisory)
        run: bash .github/scripts/shellcheck.sh

  # Typecheck, lint and design-token checks only: release-artifacts runs the one production web build (vlr build-deb's
  # pre_build) and checks its budgets, so the release never builds the web app twice (#185).
  web-verify:
    name: Web checks
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: release-check
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup web toolchain
        uses: ./.github/actions/setup_web

      - name: Run web checks
        uses: ./.github/actions/test_web

  docs-validate:
    name: Documentation validation
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs: release-check
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Validate documentation package
        run: pmdocs validate --source docs

  release-artifacts:
    name: Prepare, build and validate release artifacts
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - contracts-verify
      - web-verify
      - docs-validate
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Prepare release history (work tree only)
        run: vlr prepare --record release/meta/prepare.json

      - name: Build Debian package and web tarball
        run: vlr build-deb

      # The production web build pre_build just made (web/.next) is the one that ships.
      - name: Check web performance budgets
        run: pnpm --dir web budgets

      # The package is the only -O3 build in the release: no second build and no rerun of the test suite (the
      # required PR CI gate compiled and ran it at -O0). Check that the shipped binaries got the intended flags.
      - name: Check the package was compiled at -O3 with hardening and no warnings
        run: python3 tools/dev/check_build_flags.py release/build-deb.log

      - name: Checksums and artifact validation
        run: |
          set -euo pipefail
          vlr checksums
          vlr validate-artifacts
          vlr artifacts

      - name: Preview GitHub release
        run: |
          set -euo pipefail
          vlr release-title
          vlr release-body

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error

  publish-debian:
    name: Publish Debian package
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - release-artifacts
    if: needs.release-check.outputs.publish_required == 'true'
    environment: Production
    timeout-minutes: 30
    # One APT publication at a time across tags; queued, never cancelled.
    concurrency:
      group: vaulthalla-apt-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Prepare release history (deterministic re-run)
        run: vlr prepare

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - name: Verify artifacts
        run: |
          set -euo pipefail
          vlr checksums --verify
          vlr validate-artifacts

      # Idempotent and sha256-verified: identical bytes already live are skipped, different bytes are refused.
      - name: Publish to the APT repository
        env:
          RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'disabled' }}
          NEXUS_APT_REPO: ${{ vars.NEXUS_APT_REPO || vars.NEXUS_REPO_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || secrets.NEXUS_PASS }}
        run: vlr publish-deb --require-enabled

  github-release:
    name: GitHub release
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - publish-debian
    if: >-
      !cancelled() &&
      needs.release-check.outputs.publish_required == 'true' &&
      needs.publish-debian.result == 'success'
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # vlr github-release drives the GitHub CLI, which the CI container image carries (ci/Containerfile).
      - name: Prepare release history (deterministic re-run)
        run: vlr prepare

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - name: Verify artifacts
        run: vlr checksums --verify

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: vlr github-release

  finalize:
    name: Record the release on main
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - publish-debian
      - github-release
    if: >-
      !cancelled() &&
      needs.release-check.outputs.publish_required == 'true' &&
      needs.publish-debian.result == 'success' &&
      needs.github-release.result == 'success'
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      # main's ruleset requires pull requests and only lets admins bypass. vlr finalize pushes to main, so it needs
      # either GitHub Actions as a bypass actor on that ruleset, or RELEASE_FINALIZE_TOKEN (a token of a bypass actor
      # with contents:write). Without either, publication still succeeds and only this job fails; re-run it later.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_FINALIZE_TOKEN || github.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vaulthalla-release-${{ needs.release-check.outputs.version }}
          path: release/

      - name: Prepare release history (deterministic re-run)
        run: vlr prepare

      # Commits the promoted debian/changelog + RELEASE_NOTES.md and the cleared .release/*_NEXT.md onto main,
      # verified against what was built and published. A no-op when main already records the version.
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          vlr finalize --record release/meta/prepare.json

  docs-publish:
    # Independent of finalize: a docs failure never marks a live APT release as failed. Retry with
    # "Re-run failed jobs".
    name: Publish docs
    runs-on: [self-hosted, Linux, X64, vaulthalla, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    needs:
      - release-check
      - docs-validate
      - publish-debian
    if: >-
      !cancelled() &&
      needs.release-check.outputs.publish_required == 'true' &&
      needs.docs-validate.result == 'success' &&
      needs.publish-debian.result == 'success'
    environment: Production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Verify pmdocs
        run: |
          set -euo pipefail
          if ! command -v pmdocs >/dev/null 2>&1; then
            echo "::error::pmdocs is missing from the CI container image (ci/Containerfile)."
            exit 1
          fi
          pmdocs --version

      - name: Validate and push docs
        run: |
          set -euo pipefail
          pmdocs validate --source docs
          for attempt in 1 2 3; do
            if timeout 300 pmdocs push \
              --endpoint "${DOCS_SYNC_ENDPOINT}" \
              --source docs \
              --github-oidc \
              --publish; then
              exit 0
            fi
            echo "[docs] pmdocs push attempt ${attempt}/3 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::pmdocs push failed after 3 attempts. The APT release is unaffected; re-run this job."
          exit 1
