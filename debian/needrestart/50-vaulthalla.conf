# Vaulthalla owns a FUSE mount and manages package upgrade restarts itself.
# Let needrestart detect/report Vaulthalla units, but do not auto-restart them
# during unrelated apt transactions.
$nrconf{override_rc} = {} unless ref($nrconf{override_rc}) eq 'HASH';
$nrconf{override_rc}->{qr(^vaulthalla(?:-(?:cli|web|swtpm))?\.service$)} = 0;
$nrconf{override_rc}->{qr(^vaulthalla-cli\.socket$)} = 0;
