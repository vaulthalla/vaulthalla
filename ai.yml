profiles:
  openai-premium-deep-triage:
    provider: openai

    default_max_output_tokens:
      emergency_triage: 30000
      triage: 25000
      draft: 20000
      polish: 22000
      release_notes: 25000

    stages:
      emergency_triage:
        model: gpt-5-nano
        reasoning_effort: low
      triage:
        model: gpt-5.4-nano
        reasoning_effort: medium
      draft:
        model: gpt-5.4-mini
        reasoning_effort: high
        structured_mode: strict_json_schema
      polish:
        model: gpt-5.4
        reasoning_effort: xhigh
      release_notes:
        model: gpt-5.5
        reasoning_effort: xhigh
