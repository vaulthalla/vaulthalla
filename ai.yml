profiles:
  openai-premium-deep-triage:
    provider: openai

    default_max_output_tokens:
      emergency_triage: 50000
      triage: 30000
      draft: 20000
      polish: 22000
      release_notes: 25000

    stages:
      emergency_triage:
        model: gpt-5-nano
        reasoning_effort: low
      triage:
        model: gpt-5.4-nano
        reasoning_effort: medium
      draft:
        model: gpt-5.4-mini
        reasoning_effort: high
        structured_mode: strict_json_schema
      polish:
        model: gpt-5.4
        reasoning_effort: xhigh
      release_notes:
        model: gpt-5.5
        reasoning_effort: xhigh

  # DeepSeek over the OpenAI-compatible Responses API (key: VH_AI_RELEASE_DEEPSEEK_API_KEY).
  # `model` is the profile default for every stage; a stage may still set its own `model`, and also
  # `provider` (+ `base_url`) to mix providers, e.g. `provider: openai` + `model: gpt-5.5` for one stage.
  # Budgets run ~20% above the OpenAI profile because DeepSeek reasoning tokens count toward output.
  ds-flash:
    provider: deepseek
    model: deepseek-flash

    default_max_output_tokens:
      emergency_triage: 60000
      triage: 36000
      draft: 24000
      polish: 28000
      release_notes: 32000

    stages:
      emergency_triage:
        reasoning_effort: medium
      triage:
        reasoning_effort: medium
      draft:
        reasoning_effort: medium
        structured_mode: strict_json_schema
      polish:
        reasoning_effort: max
      release_notes:
        reasoning_effort: max
